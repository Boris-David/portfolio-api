name: CI

on:
  push:
    branches: [main]
  pull_request:

# One useful run per ref: the previous ones are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, types, contract and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Résumé rendering is tested for real: a test that skips the engine
      # proves nothing about what the recruiter will download.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # The OpenAPI contract is derived from the Zod schemas. If it has not
      # been regenerated, review reads a contract that lies — that is blocking.
      - name: OpenAPI contract up to date
        run: npm run check:openapi

      # The design tokens belong to the hub repo; this repo carries a snapshot,
      # held by this comparison.
      - name: Design tokens have not drifted
        run: npm run check:tokens

      - name: Tests
        run: npm test

  worker:
    name: Worker — bundle and real execution
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The assets must exist before the Worker comes up: the résumé is
      # rendered at build time, never on request.
      - name: Render the résumés
        run: npm run build:cv

      - name: Build the script
        run: npm run build

      # The content is bundled INTO the script: it grows with every app added.
      # The remaining headroom gets measured, not assumed.
      - name: Script fits under the free plan ceiling
        run: npm run check:bundle

      # The unit tests run on Node. Only this step proves that what will be
      # deployed works: workerd, the real bundle, the bindings, and the absence
      # of a file system.
      - name: Exercise the Worker on workerd
        run: npm run smoke
