name: Cloudflare Workers deployment

# Wired up. Any green CI on `main` publishes the API — and, with it, the
# rendered résumé.
#
# The setup below is already in place on the repo and only needs re-reading to
# reproduce it elsewhere, or if a token rotation breaks the deployment.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT HAS TO BE CREATED, ONCE
# ─────────────────────────────────────────────────────────────────────────────
#
# 1. A Cloudflare account, with Workers enabled on it.
#    Free plan: 100,000 requests/day, static assets free and unlimited, no
#    bandwidth billed. **No credit card.**
#
# 2. An API token — dashboard → My Profile → API Tokens →
#    Create Token → Edit Cloudflare Workers, then narrowed down to:
#
#      Account · Workers Scripts        : Edit
#      Account · Account Settings       : Read
#      Zone    · Workers Routes         : Edit   (zone amissan.dev)
#      Zone    · Zone                   : Read   (zone amissan.dev)
#
#    The two zone scopes only serve the custom domain; without them the
#    deployment succeeds but `api.amissan.dev` is not created.
#
# 3. In this repo — Settings → Secrets and variables → Actions:
#
#      Secret    CLOUDFLARE_API_TOKEN    the token above
#      Variable  CLOUDFLARE_ACCOUNT_ID   the account id (Workers → Overview)
#
#    Nothing else. The Worker name, the assets and the domain are declared in
#    `wrangler.jsonc`, which is versioned.
#
# 4. The `api.amissan.dev` domain: **nothing to click**. `amissan.dev` is
#    registered with Cloudflare Registrar, so the zone is already on the
#    account, and `wrangler deploy` creates the DNS record and the custom
#    domain from `routes` in `wrangler.jsonc`.
#
#    To be done by hand only if preferred: Workers & Pages →
#    portfolio-api → Settings → Domains & Routes → Add → Custom Domain →
#    "api.amissan.dev".
#
# No private key, no service file: the token is the only secret, and it lives
# in the repo's secrets — never in the repo, which is public.

on:
  # Deployment follows CI, it does not race alongside it. `workflow_run` fires
  # at the **end** of CI: nothing goes live without the test suite having
  # passed on the exact commit being published.
  #
  # The two other wirings were ruled out:
  #
  #   `on: push` — would start **in parallel** with CI. The deployment would
  #   win the race one time in two and publish a commit whose tests then fail.
  #   A guard that runs after publication guards nothing.
  #
  #   a `deploy` job inside `ci.yml` with `needs:` — would bring the Cloudflare
  #   token into the workflow that runs on **every pull request**. A CI that
  #   needs no secret can leak none; that is a checkable property, and it is
  #   worth more than saving a file.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Stays triggerable by hand: republishing without a new commit — a token
  # rotation, or re-rendering the résumé after a build environment change.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Render the résumé, then publish
    runs-on: ubuntu-latest
    # `workflow_run` fires whether CI **succeeded or failed** — `on:` has no
    # filter on the conclusion, so it is written here.
    #
    # The `event == 'push'` is not belt and braces: `branches: [main]` filters
    # on the *source* branch. A pull request from a fork whose branch is called
    # `main` would satisfy it — and would deploy the fork's code. Only a push
    # to our own `main` triggers a publication.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      # This check used to pass the step in silence when the token was missing,
      # because no token existed yet. It fails now that deployment is
      # automatic: a deployment that "succeeds" without publishing anything
      # makes a merged fix look live when it is not.
      - name: Check that the configuration exists
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN (secret)"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID (variable)"
          if [ -n "$missing" ]; then
            echo "::error::Deployment not configured, missing:$missing — see the header of this workflow."
            exit 1
          fi

      # `workflow_run` runs the workflow file from the default branch, but does
      # not position the repo for you: without `ref`, we would publish the head
      # of `main` as of deployment time, not the commit CI validated. Two
      # merges close together are enough to make them differ — and here the gap
      # would cover the rendered résumé's content too.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Résumé rendering lives here and nowhere else: Chromium does not run on
      # Workers, and ADR 0004 wants rendering triggered by a content change —
      # so by this build, never by a request.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render the résumés
        run: npm run build:cv

      # Consistency guard before publishing: the manifest must have been sealed
      # for the content the Worker bundles. The smoke test refuses to start on
      # a "degraded", so it catches the divergence here rather than in
      # production.
      - name: Exercise the Worker on workerd
        run: npm run smoke

      - name: Publish the Worker and its assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # ─────────────────────────────────────────────────────────────────────
      # Propagate to the website — the fast path (ADR 0007)
      # ─────────────────────────────────────────────────────────────────────
      #
      # `portfolio-web` is a static export: it does not "refresh" its content,
      # it **rebuilds**. Without this signal, a change published here would
      # stay invisible on the site until its freshness check caught up — three
      # hours at worst.
      #
      # The token is a fine-grained PAT limited to the `portfolio-web` repo
      # alone, permission "Contents: read and write". It lives in THIS repo's
      # secrets and has no rights anywhere else.
      #
      # Its absence **does not fail** the run — and that is the only graceful
      # fallback this workflow allows itself, because it is genuinely covered:
      # the site's freshness check detects and repairs a missed propagation on
      # its own. What is lost without the token is speed, never correctness.
      - name: Check the digest of the published content
        id: content
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            version="$(curl -fsS "https://api.amissan.dev/v1/portfolio?lang=fr" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["meta"]["contentVersion"])' || true)"
            [ -n "${version:-}" ] && break
            sleep 5
          done
          if [ -z "${version:-}" ]; then
            echo "::error::The API is not answering after publication — incomplete deployment."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Content live: $version"

      - name: Ask the website to rebuild
        env:
          TOKEN: ${{ secrets.PORTFOLIO_WEB_DISPATCH_TOKEN }}
          VERSION: ${{ steps.content.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::warning::PORTFOLIO_WEB_DISPATCH_TOKEN missing — the site will update through its freshness check (3 h at worst). See the header of this workflow."
            exit 0
          fi

          code="$(curl -sS -o /tmp/dispatch.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Boris-David/portfolio-web/dispatches \
            -d "{\"event_type\":\"contenu-mis-a-jour\",\"client_payload\":{\"contentVersion\":\"$VERSION\"}}")"

          # 204 is the only correct answer. A 404 almost always means a token
          # without the "Contents: write" permission on the target repo —
          # GitHub does not distinguish "missing" from "not allowed to see it".
          if [ "$code" != "204" ]; then
            echo "::error::The website could not be notified (HTTP $code)."
            [ "$code" = "404" ] && echo "404: repo not found OR token without the \"Contents: write\" permission on portfolio-web."
            cat /tmp/dispatch.txt
            exit 1
          fi
          echo "Website notified — rebuilding on content $VERSION."
