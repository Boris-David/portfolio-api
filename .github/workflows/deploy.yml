name: Déploiement Cloudflare Workers

# Branché. Toute CI verte sur `main` publie l'API — et, avec elle, le CV rendu.
#
# La configuration ci-dessous est posée sur le dépôt et n'est à relire que pour
# la reproduire ailleurs, ou si une rotation de jeton casse le déploiement.
#
# ─────────────────────────────────────────────────────────────────────────────
# CE QU'IL FAUT CRÉER, UNE FOIS
# ─────────────────────────────────────────────────────────────────────────────
#
# 1. Un compte Cloudflare, et y activer Workers.
#    Plan gratuit : 100 000 requêtes/jour, assets statiques gratuits et
#    illimités, aucune bande passante facturée. **Aucune carte bancaire.**
#
# 2. Un jeton d'API — tableau de bord → My Profile → API Tokens →
#    Create Token → Edit Cloudflare Workers, puis restreindre à :
#
#      Account · Workers Scripts        : Edit
#      Account · Account Settings       : Read
#      Zone    · Workers Routes         : Edit   (zone amissan.dev)
#      Zone    · Zone                   : Read   (zone amissan.dev)
#
#    Les deux portées de zone ne servent qu'au domaine personnalisé ; sans
#    elles, le déploiement réussit mais `api.amissan.dev` n'est pas créé.
#
# 3. Dans ce dépôt — Settings → Secrets and variables → Actions :
#
#      Secret    CLOUDFLARE_API_TOKEN    le jeton ci-dessus
#      Variable  CLOUDFLARE_ACCOUNT_ID   l'identifiant de compte (Workers → Overview)
#
#    Rien d'autre. Le nom du Worker, les assets et le domaine sont déclarés
#    dans `wrangler.jsonc`, versionné.
#
# 4. Le domaine `api.amissan.dev` : **rien à cliquer**. `amissan.dev` est
#    enregistré chez Cloudflare Registrar, donc la zone est déjà sur le compte,
#    et `wrangler deploy` crée l'enregistrement DNS et le domaine personnalisé
#    à partir de `routes` dans `wrangler.jsonc`.
#
#    À faire à la main uniquement si on préfère : Workers & Pages →
#    portfolio-api → Settings → Domains & Routes → Add → Custom Domain →
#    « api.amissan.dev ».
#
# Aucune clé privée, aucun fichier de service : le jeton est le seul secret, et
# il vit dans les secrets du dépôt — jamais dans le dépôt, qui est public.

on:
  # Le déploiement suit la CI, il ne court pas à côté d'elle. `workflow_run` se
  # déclenche à la **fin** de la CI : rien ne part en ligne sans que la suite de
  # tests soit passée sur le commit exact qu'on publie.
  #
  # Les deux autres montages ont été écartés :
  #
  #   `on: push` — partirait **en parallèle** de la CI. Le déploiement gagnerait
  #   la course une fois sur deux et publierait un commit dont les tests
  #   échouent ensuite. Une garde qui s'exécute après la publication ne garde
  #   rien.
  #
  #   un job `deployer` dans `ci.yml` avec `needs:` — ferait entrer le jeton
  #   Cloudflare dans le workflow qui s'exécute sur **chaque pull request**.
  #   Une CI qui n'a besoin d'aucun secret ne peut en fuiter aucun ; c'est une
  #   propriété vérifiable, elle vaut plus que l'économie d'un fichier.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Reste déclenchable à la main : republier sans nouveau commit — rotation de
  # jeton, ou re-rendu du CV après un changement d'environnement de build.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  deployer:
    name: Rendre le CV, puis publier
    runs-on: ubuntu-latest
    # `workflow_run` se déclenche que la CI ait **réussi ou échoué** — `on:` n'a
    # pas de filtre sur la conclusion, il s'écrit ici.
    #
    # Le `event == 'push'` n'est pas de la ceinture-bretelles : `branches:
    # [main]` filtre sur la branche *source*. Une pull request venue d'un fork
    # dont la branche s'appelle `main` la satisferait — et déploierait le code
    # du fork. Seul un push sur notre `main` déclenche une publication.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      # Ce contrôle passait l'étape en silence quand le jeton manquait, parce
      # qu'aucun jeton n'existait encore. Il échoue depuis que le déploiement
      # est automatique : un déploiement qui « réussit » sans rien publier
      # laisse croire qu'un correctif mergé est en ligne.
      - name: Vérifier que la configuration existe
        env:
          JETON: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPTE: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          manquants=""
          [ -n "$JETON" ] || manquants="$manquants CLOUDFLARE_API_TOKEN (secret)"
          [ -n "$COMPTE" ] || manquants="$manquants CLOUDFLARE_ACCOUNT_ID (variable)"
          if [ -n "$manquants" ]; then
            echo "::error::Déploiement non configuré, manquant :$manquants — voir l'en-tête de ce workflow."
            exit 1
          fi

      # `workflow_run` exécute le fichier de workflow de la branche par défaut,
      # mais ne positionne pas le dépôt pour autant : sans `ref`, on publierait
      # la tête de `main` au moment du déploiement, pas le commit que la CI a
      # validé. Deux merges rapprochés suffisent à les rendre différents — et
      # ici l'écart porterait aussi sur le contenu du CV rendu.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Le rendu du CV vit ici, et nulle part ailleurs : Chromium ne tourne pas
      # sur Workers, et l'ADR 0004 veut que le rendu soit déclenché par le
      # changement de contenu — donc par ce build, jamais par une requête.
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Rendre les CV
        run: npm run build:cv

      # Garde de cohérence avant publication : le manifeste doit avoir été
      # scellé pour le contenu que le Worker embarque. Le smoke test refuse de
      # démarrer sur un « degraded », donc il attrape la divergence ici plutôt
      # qu'en production.
      - name: Exercer le Worker sur workerd
        run: npm run smoke

      - name: Publier le Worker et ses assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
